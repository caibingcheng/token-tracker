name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'        # 正式版 v1.3.0 / pre-release v1.3.0-dev.1、v1.6.0-alpha.1、v1.6.0-rc.1
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 串行发布：latest / dev 是浮动标签，并发推送会让浮动标签与构建顺序错位
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 发布约束（fail-closed）：tag 必须落在受信分支的历史内。
      # vX.Y.Z（正式版）只认 main；vX.Y.Z-<prerelease>（devN / alpha.N / rc.N）认 main 或 dev。
      # 其余命名一律失败，避免 metadata 的 latest 规则把预发布版推成正式版。
      - name: Verify tag ancestry
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            bases=(main)
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            bases=(main dev)
          else
            echo "::error::unsupported tag '$TAG': expected vX.Y.Z or vX.Y.Z-<prerelease>"
            exit 1
          fi
          ok=0
          for base in "${bases[@]}"; do
            git fetch --no-tags origin "+refs/heads/$base:refs/remotes/origin/$base"
            if git merge-base --is-ancestor HEAD "origin/$base"; then
              echo "OK: $TAG is on origin/$base"
              ok=1
              break
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::error::tag '$TAG' points to a commit outside origin/${bases[*]}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 必须用 type=semver 而非 type=ref,event=tag：后者在 flavor.latest=auto 下
          # 无条件置 latest=true（不判 prerelease），且 version.latest 只由首个 tag 决定，
          # 后面 raw latest 的 enable=false 无法覆盖 → pre-release tag 会被打上 :latest。
          # semver 分支是唯一按 semver.prerelease() 判断的：prerelease → 不加 latest。
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=raw,value=dev,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
            type=sha,format=short

      # relay 镜像：同一仓库、同一 commit、同一 tag 前缀（<image>-relay）
      - name: Extract metadata (relay)
        id: meta-relay
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-relay
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=raw,value=dev,enable=${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
            type=sha,format=short

      # 先只构建并 load 到本地 runner，smoke test 通过后才推送
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 构建成功 != 镜像能启动。这里跑一次真实启动 + 首次建库 + 一次统计查询
      - name: Smoke test image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$IMAGE_TAGS" | tr ',' '\n' | head -n1)"
          # 每次随机生成，仓库里不留任何形似凭证的字面量（临时容器 + 空库，用完即弃）
          docker run -d --name smoke \
            -p 127.0.0.1:3000:3000 \
            -e GATEWAY_SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_API_KEY="$(openssl rand -hex 16)" \
            -e SQLITE_DATABASE_PATH=/tmp/token-tracker.db \
            "$image"
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/api/cli; then
              ok=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null || echo false)" != "true" ]; then
              break
            fi
            sleep 2
          done
          docker logs smoke 2>&1 | tail -n 40 || true
          docker rm -f smoke >/dev/null 2>&1 || true
          if [ "$ok" != 1 ]; then
            echo "::error::smoke test failed: container never served /api/cli"
            exit 1
          fi

      - name: Build relay image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: relay
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta-relay.outputs.tags }}
          labels: ${{ steps.meta-relay.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # relay 镜像自检：必须能起、/pair 可访问、/api/* 一律 404（device 端点只属于中心）
      - name: Smoke test relay image
        env:
          RELAY_TAGS: ${{ steps.meta-relay.outputs.tags }}
        run: |
          set -euo pipefail
          image="$(printf '%s' "$RELAY_TAGS" | tr ',' '\n' | head -n1)"
          docker run -d --name smoke-relay \
            -p 127.0.0.1:3100:3000 \
            -e CENTER_URL=http://127.0.0.1:9/ \
            -e RELAY_STATE_PATH=/tmp/relay.state.json \
            "$image"
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/pair; then
              ok=1
              break
            fi
            sleep 1
          done
          api_status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/api/device/plan || true)"
          docker logs smoke-relay 2>&1 | tail -n 20 || true
          docker rm -f smoke-relay >/dev/null 2>&1 || true
          if [ "$ok" != 1 ]; then
            echo "::error::relay smoke test failed: /pair never served"
            exit 1
          fi
          if [ "$api_status" != "404" ]; then
            echo "::error::relay must not expose /api/* (got $api_status)"
            exit 1
          fi

      # 浮动标签（latest / dev）最后推：部分推送失败时不会让浮动标签先指向新镜像
      - name: Push image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELAY_TAGS: ${{ steps.meta-relay.outputs.tags }}
        run: |
          set -euo pipefail
          push_tags() {
            # metadata-action 的 tags 输出可能是逗号或换行分隔，统一成每行一个并去掉空项
            local tags
            tags="$(printf '%s' "$1" | tr ',' '\n' | grep -v '^[[:space:]]*$' || true)"
            if [ -z "$tags" ]; then
              echo "::error::no image tags to push (metadata output was empty)"
              exit 1
            fi
            # 先推带版本/sha 的固定标签，再推浮动标签（latest / dev）
            while IFS= read -r t; do
              case "$t" in
                *:latest|*:dev) continue ;;
              esac
              echo "Pushing $t"
              docker push "$t"
            done <<< "$tags"
            while IFS= read -r t; do
              case "$t" in
                *:latest|*:dev) ;;
                *) continue ;;
              esac
              echo "Pushing $t"
              docker push "$t"
            done <<< "$tags"
          }
          push_tags "$IMAGE_TAGS"
          push_tags "$RELAY_TAGS"
