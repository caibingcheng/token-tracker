name: Create PR dev into main

on:
  push:
    branches:
      - dev

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Create or reuse PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          existing_pr=$(gh pr list \
            --base main \
            --head dev \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            echo "No open PR found, creating one..."
            gh pr create \
              --base main \
              --head dev \
              --title "Auto merge dev into main" \
              --body "This PR was created automatically by GitHub Actions."
          else
            echo "Reusing existing PR #$existing_pr"
          fi
