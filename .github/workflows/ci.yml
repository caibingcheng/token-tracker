name: CI

# dev 的提交经 pr-dev-to-main.yml 自动汇总成一个 PR，故只在 PR 上检查，避免双跑
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # lock 必须由与 Dockerfile（node:22-slim）相同的 npm 主版本生成：本机 npm 11+ 会修剪
      # optional peer 依赖，写出镜像与 CI 都装不了的 lock（表现为 EUSAGE: Missing: ... from lock file）。
      # 断言而非静默升级：升 Node 时 CI 与 Dockerfile 必须同批改（见 AGENTS.md 硬约束）
      - name: Verify npm matches Docker image
        run: |
          major=$(npm -v | cut -d. -f1)
          if [ "$major" != "10" ]; then
            echo "::error::CI npm is $major but Dockerfile uses node:22-slim (npm 10)."
            echo "Regenerate package-lock.json with npm 10, or bump Dockerfile and this assertion together."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # 同 lint-and-test：lock 与 Dockerfile 必须共用同一个 npm 主版本
      - name: Verify npm matches Docker image
        run: |
          major=$(npm -v | cut -d. -f1)
          if [ "$major" != "10" ]; then
            echo "::error::CI npm is $major but Dockerfile uses node:22-slim (npm 10)."
            echo "Regenerate package-lock.json with npm 10, or bump Dockerfile and this assertion together."
            exit 1
          fi

      - run: npm ci

      # next build 会做构建期类型检查（tsconfig 排除了 *.test.ts）。
      # 不注入 GATEWAY_SECRET：与 Dockerfile builder 阶段一致，build 期本就不需要它
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # 新构建链产物断言：三步（gen-routes / next build export / esbuild）任一被回退都要红
      - run: test -f build/server.js && test -f out/index.html && test -f build/relay.js
      # relay bundle 不得包含中心专用模块（构建期 plugin 已拦，这里是第二道断言）
      - name: relay bundle must not contain center-only modules
        run: |
          if grep -q "better-sqlite3" build/relay.js || grep -q "initDatabase" build/relay.js; then
            echo "::error::build/relay.js contains center-only code (better-sqlite3 / initDatabase)"
            exit 1
          fi
      # gen-routes 构建期就地重写生成物；改了 route 忘重跑/忘提交生成物时在这里拦下漂移
      - run: git diff --exit-code -- src/server/routes.generated.ts
