services:
  token-tracker:
    image: ghcr.io/caibingcheng/token-tracker:latest
    container_name: token-tracker
    restart: unless-stopped
    ports:
      # 生产：前置反向代理（HTTPS 终止）时建议改为 "127.0.0.1:3001:3000"，
      # 只让反代能访问，避免明文 HTTP 直接暴露到公网
      - "3001:3000"
    environment:
      - SQLITE_DATABASE_PATH=/app/data/token-tracker.db
      # 必填，无默认值：compose 在变量缺失时直接报错退出（不再有公开的出厂默认凭证）。
      # 个人/家庭部署允许弱 key，强度仅由前端提示；生产仍建议 openssl rand -hex 24。
      # 已配置弱 key 也不会让首次设置向导重新打开。
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY is required; openssl rand -hex 24 is recommended}
      # 必填，无默认值：AES-256-GCM 主密钥（hex 64 / base64 32B / 任意字符串派生）。
      # 生成：openssl rand -hex 32
      - GATEWAY_SECRET=${GATEWAY_SECRET:?GATEWAY_SECRET is required (openssl rand -hex 32)}
      - API_CACHE_DEBUG=false
      # 安全：仅当前置反代已设置 X-Real-IP（并覆盖客户端 XFF）时设为 true。
      # 默认 false 时登录/设置限流使用全局桶（防 XFF 伪造绕过），审计 IP 记为 unknown。
      # 反代需配置：proxy_set_header X-Real-IP $remote_addr;
      #              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      - TRUSTED_PROXY=false
    volumes:
      - ./data:/app/data
    # 可选：显式内存上限（与 Dockerfile 的 NODE_OPTIONS 128MB 堆上限 + instrumentation 周期回收对齐，
    # 512MB 容器限额足够覆盖堆 + V8/原生基线）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 1g

  # === relay（sub node）：可选，请求体不经中心 ===
  # 镜像：ghcr.io/caibingcheng/token-tracker-relay:latest（同一 tag 前缀）
  # 客户端 base_url 指向它（而非中心），每请求向中心要一次执行计划。
  # 首次启动：docker logs 读 8 位码（或 http://host:3002/pair）→ 中心 Admin → Devices 输码授权。
  # 建议与中心同机/内网（每请求 +1 次 plan 往返，跨公网会多 1 RTT）。
  # token-tracker-relay:
  #   image: ghcr.io/caibingcheng/token-tracker-relay:latest
  #   container_name: token-tracker-relay
  #   restart: unless-stopped
  #   ports:
  #     - "3002:3000"
  #   environment:
  #     - CENTER_URL=http://token-tracker:3000
  #     - RELAY_DEVICE_NAME=laptop
  #     # 同机/内网用明文 http 与私网上游时需要；公网部署请改用 https 并保持默认
  #     - ALLOW_PRIVATE_UPSTREAMS=true
  #     # /pair 页默认仅环回/私网可访问（local）；公网 relay 不要改成 on
  #     - RELAY_PAIR_PAGE=local
  #     # body 上限本端权威，允许比中心大（body 不经中心）
  #     - GATEWAY_MAX_BODY_MB=32
  #   volumes:
  #     - ./relay-data:/app/data
